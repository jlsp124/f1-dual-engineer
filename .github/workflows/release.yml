name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    env:
      POETRY_VERSION: 2.2.1

    steps:
      - name: Checkout repository and viewer submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: python -m pip install "poetry==$env:POETRY_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: python -m poetry install --no-interaction --no-root

      - name: Run deterministic test suite
        run: python -m poetry run pytest tests/ -q

      - name: Build standalone executable
        run: python -m poetry run python scripts/build.py

      - name: Smoke-test frozen launcher
        shell: pwsh
        run: |
          $exe = Get-Item "dist\f1_dual_engineer_*.exe"
          $runtimeRoot = Join-Path $env:LOCALAPPDATA "f1_dual_engineer"
          $marker = Join-Path $runtimeRoot "f1_dual_engineer_smoke_test.txt"
          $launchDir = Join-Path $env:RUNNER_TEMP "f1-dual-engineer-nonproject-cwd"
          New-Item -ItemType Directory -Path $launchDir -Force | Out-Null
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          Push-Location $launchDir
          try {
            & $exe.FullName --smoke-test hello-smoke
          } finally {
            Pop-Location
          }
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path -LiteralPath $marker) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw) -ne "hello-smoke") {
            throw "Frozen launcher smoke marker was not written correctly"
          }
          if ((Get-ChildItem -LiteralPath $launchDir -Force | Measure-Object).Count -ne 0) {
            throw "Frozen launcher wrote mutable files beneath its current working directory"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist\f1_dual_engineer_*.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "dist\checksums.txt" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: f1-dual-engineer-windows
          path: |
            dist/f1_dual_engineer_*.exe
            dist/checksums.txt

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES_v0.1.1.md
          files: |
            dist/f1_dual_engineer_*.exe
            dist/checksums.txt
          fail_on_unmatched_files: true
